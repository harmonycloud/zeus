apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-pilot
  namespace: logging

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: log-pilot-role
rules:
  - apiGroups: [""]
    resources:
      - "nodes"
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: log-pilot-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: log-pilot-role
subjects:
  - kind: ServiceAccount
    name: log-pilot
    namespace: logging