{{- if  .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    prometheus: k8s
    platform: zeus
    role: alert-rules
  annotations:
    target_type: cluster
    target_alias_name: "中间件控制器"
    target_name: middlewareController
  name: middleware-controller-rules
spec:
  groups:
  - name: middleware-rules
    rules:
    - alert: middlewareControllerCpuUsageHigh
      annotations:
        message: cpu usage high for {{`{{ $labels.pod }}`}}
        summary: cpu usage high for {{`{{ $labels.pod }}`}}
      expr: (sum by (pod) (rate(container_cpu_usage_seconds_total{image!="",container!~"|POD",endpoint!="", pod=~"middleware-api-.+|middleware-controller-manager.+",namespace="middleware-operator"}[5m]))) / (sum by (pod) (kube_pod_container_resource_requests{resource="cpu", container=~"manager|middleware-api", pod=~"middleware-api-.+|middleware-controller-manager.+", namespace="middleware-operator"})) > 0.8
      for: 5m
      labels:
        severity: warning
    - alert: middlewareControllerMemoryUsageHigh
      annotations:
        message: memory usage high for {{`{{ $labels.pod }}`}}
        summary: memory usage high for {{`{{ $labels.pod }}`}}
      expr: (sum by (pod)(container_memory_working_set_bytes{container!~"|POD",endpoint!="",pod=~"middleware-api-.+|middleware-controller-manager.+",namespace="middleware-operator"})) * 100 / (sum by (pod) (kube_pod_container_resource_requests{container=~"manager|middleware-api",resource="memory",pod=~"middleware-api-.+|middleware-controller-manager.+",namespace="middleware-operator"})) > 80
      for: 5m
      labels:
        severity: warning
    - alert: middlewareControllerInstanceNotRunning
      annotations:
        message: middlewareController instance {{`{{ $labels.instance }}`}} not running
        summary: middlewareController instance {{`{{ $labels.instance }}`}} not running
      expr: kube_pod_container_status_running{namespace="middleware-operator",container=~"manager|middleware-api",pod=~"middleware-api-.+|middleware-controller-manager.+"} == 0
      for: 30s
      labels:
        severity: critical
{{- end }}