mysqlcluster:
  harmonycloud-middleware-status-phase: 'if .metadata.annotations."middleware.maintenance.lock"=="middlewarebackup" 
    then . + {status: (.status +  {"phase": "Recover"})} 
  else if .metadata.annotations."middleware.maintenance.lock"=="middlewarebackup-restore-failed" 
    then . + {status: (.status +  {"phase": "RecoverFailed"})} 
  else if .metadata.annotations."middleware.maintenance.lock"=="graceful-restart" 
    then . + {status: (.status +  {"phase": "GracefulRestart"})} 
    else . end end end'
  harmonycloud-middleware-status-process: '. + {status: (.status +  {"process": .metadata.annotations."middleware.maintenance.phase"})}'
  harmonycloud-middleware-status-reason: 'if .metadata.annotations."middleware.maintenance.reason" != null
  then . + {status: (.status +  {"reason": .metadata.annotations."middleware.maintenance.reason"})}
  else . end'
  harmonycloud-middleware-status-log: '. + {status: (.status +  {"log": .metadata.annotations."middleware.maintenance.log"})}'
