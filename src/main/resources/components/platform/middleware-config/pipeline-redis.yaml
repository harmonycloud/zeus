name: "redis-cluster优雅重启"
jobs:
  # 检查状态
  - name: "初始化状态检查"
    cmd: "kubectl -n $namespace get $kind $name -o json |jq -r '.status.phase'"
    result: "Running"
  # 记录主从状态
  - name: "记录当前主从状态"
    func: SavePodType
  # 重启从库
  - name: "第一次重启从库"
    func: DeletePod
    para:
      type: "slave"
  # 等待ready
  - name: "等待集群正常"
    func: WaitReady
  # 主从切换
  - name: "主从切换"
    para:
      cmd: "kubectl -n $namespace exec  $podName -c redis-cluster -- /bin/bash -c 'redis-cli -h ${PODIP} -a ${REDIS_PASS} -p ${REDIS_INSTANCE_PORT} cluster failover'"
      type: "slave"
    func: SwitchOver
  # 重启从库
  - name: "第二次重启从库"
    func: DeletePod
    para:
      type: "slave"
  - name: "重启完毕，等待状态恢复正常"
    func: WaitReady