rules:
- name: rediscluster
  mode: cluster
  paraPath: parameters-redis.yaml
  pipePath: "pipeline-redis.yaml"
  configmap:
    name: "{{name}}-config"
    file: "redis.conf"
    regx: '\s*([a-zA-Z\\-]+)\s*([0-9a-zA-Z\\-]+)\s*?\n'
  attributeJQ:
    replicas: ".spec.replicas"
    redisResource: ".spec.pod[0].resources"
    redisMiddlewareImage: ".spec.pod[0].middlewareImage"
    redisPassword: ".spec.pod[0].requirepass"
- name: rediscluster
  mode: sentinel
  paraPath: parameters-redis.yaml
  pipePath: "pipeline-sentinel-redis.yaml"
  configmap:
    name: "{{name}}-config"
    file: "redis.conf"
    regx: '\s*([a-zA-Z\\-]+)\s*([0-9a-zA-Z\\-]+)\s*?\n'
  attributeJQ:
    replicas: ".spec.replicas"
    redisResource: ".spec.pod[0].resources"
    redisMiddlewareImage: ".spec.pod[0].middlewareImage"
    redisPassword: ".spec.pod[0].requirepass"
- name: postgresql
  pipePath: "pipeline-postgresql.yaml"