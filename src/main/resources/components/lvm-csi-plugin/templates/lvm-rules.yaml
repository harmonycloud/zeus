{{- if  .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    prometheus: k8s
    platform: zeus
    role: alert-rules
  annotations:
    target_type: cluster
    target_alias_name: "LVM控制器"
    target_name: lvmController
  name: lvm-rules
spec:
  groups:
  - name: middleware-rules
    rules:
    - alert: lvmControllerCpuUsageHigh
      annotations:
        message: cpu usage high for {{`{{ $labels.pod }}`}}
        summary: cpu usage high for {{`{{ $labels.pod }}`}}
      expr: (sum by (pod) (rate(container_cpu_usage_seconds_total{image!="",container!~"|POD",endpoint!="", pod=~"lvm-csi-plugin.+",namespace="middleware-operator"}[5m]))) / (sum by (pod) (kube_pod_container_resource_requests{resource="cpu", pod=~"lvm-csi-plugin.+", namespace="middleware-operator"})) > 0.8
      for: 5m
      labels:
        severity: critical
    - alert: lvmControllerMemoryUsageHigh
      annotations:
        message: memory usage high for {{`{{ $labels.pod }}`}}
        summary: memory usage high for {{`{{ $labels.pod }}`}}
      expr: (sum by (pod)(container_memory_working_set_bytes{container!~"|POD",endpoint!="",pod=~"lvm-csi-plugin.+",namespace="middleware-operator"})) * 100 / (sum by (pod) (kube_pod_container_resource_requests{resource="memory",pod=~"lvm-csi-plugin.+",namespace="middleware-operator"})) > 80
      for: 5m
      labels:
        severity: critical
    - alert: lvmControllerInstanceNotReady
      annotations:
        message: lvm instance {{`{{ $labels.instance }}`}} not ready
        summary: lvm instance {{`{{ $labels.instance }}`}} not ready
      expr: kube_pod_container_status_ready{namespace="middleware-operator",pod=~"lvm-csi-plugin.+"} == 0
      for: 30s
      labels:
        severity: warning
    - alert: lvmControllerInstanceNotRunning
      annotations:
        message: lvm instance {{`{{ $labels.instance }}`}} not running
        summary: lvm instance {{`{{ $labels.instance }}`}} not running
      expr: kube_pod_container_status_running{namespace="middleware-operator",pod=~"lvm-csi-plugin.+"} == 0
      for: 30s
      labels:
        severity: critical
{{- end }}