{{- if  .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  generation: 1
  labels:
    app: {{ include "logstash.fullname" . }}-exporter-monitor
  name: {{ include "logstash.fullname" . }}-exporter-monitor
spec:
  endpoints:
    - interval: 30s
      port: metrics
      scheme: http
      relabelings:
        - replacement: logstash
          targetLabel: middleware
        - sourceLabels: [service]
          replacement: {{ include "logstash.fullname" . }}
          targetLabel: service
  selector:
    matchLabels:
      app: {{ include "logstash.fullname" . }}-exporter-svc
  {{- end }}
