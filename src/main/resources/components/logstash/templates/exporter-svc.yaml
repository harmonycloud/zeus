apiVersion: v1
kind: Service
metadata:
  name: {{ include "logstash.fullname" . }}-exporter-svc
  labels:
    app: {{ include "logstash.fullname" . }}-exporter-svc
spec:
  type: ClusterIP
  ports:
    - port: 9198
      targetPort: 9198
      protocol: TCP
      name: metrics
  selector:
    app: {{ include "logstash.fullname" . }}-exporter
