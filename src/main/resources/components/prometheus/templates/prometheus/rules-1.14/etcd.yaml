{{- /*
Generated from 'etcd' group from https://raw.githubusercontent.com/etcd-io/website/master/content/en/docs/v3.4/op-guide/etcd3_alert.rules.yml
Do not change in-place! In order to change this file first read following link:
https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack/hack
*/ -}}
{{- $kubeTargetVersion := default .Capabilities.KubeVersion.GitVersion .Values.kubeTargetVersionOverride }}
{{- if and (semverCompare ">=1.14.0-0" $kubeTargetVersion) (semverCompare "<9.9.9-9" $kubeTargetVersion) .Values.defaultRules.create .Values.kubeEtcd.enabled .Values.defaultRules.rules.etcd }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ printf "%s-%s" (include "kube-prometheus-stack.fullname" .) "etcd" | trunc 63 | trimSuffix "-" }}
  namespace: {{ template "kube-prometheus-stack.namespace" . }}
  labels:
    app: {{ template "kube-prometheus-stack.name" . }}
    platform: zeus
{{ include "kube-prometheus-stack.labels" . | indent 4 }}
{{- if .Values.defaultRules.labels }}
{{ toYaml .Values.defaultRules.labels | indent 4 }}
{{- end }}
{{- if .Values.defaultRules.annotations }}
  annotations:
    target_alias_name: 集群监控
    target_name: cluster
    target_type: cluster
{{ toYaml .Values.defaultRules.annotations | indent 4 }}
{{- end }}
spec:
  groups:
  - name: etcd
    rules:
{{- if not (.Values.defaultRules.disabled.etcdInsufficientMembers | default false) }}
    - alert: etcdInsufficientMembers
      annotations:
        message: 'etcd cluster "{{`{{`}} $labels.job {{`}}`}}": insufficient members ({{`{{`}} $value {{`}}`}}).'
      expr: sum(up{job=~".*etcd.*"} == bool 1) by (job) < ((count(up{job=~".*etcd.*"}) by (job) + 1) / 2)
      for: 3m
      labels:
        severity: critical
{{- if .Values.defaultRules.additionalRuleLabels }}
{{ toYaml .Values.defaultRules.additionalRuleLabels | indent 8 }}
{{- end }}
{{- end }}
{{- if not (.Values.defaultRules.disabled.etcdNoLeader | default false) }}
    - alert: etcdNoLeader
      annotations:
        message: 'etcd cluster "{{`{{`}} $labels.job {{`}}`}}": member {{`{{`}} $labels.instance {{`}}`}} has no leader.'
      expr: etcd_server_has_leader{job=~".*etcd.*"} == 0
      for: 1m
      labels:
        severity: critical
{{- if .Values.defaultRules.additionalRuleLabels }}
{{ toYaml .Values.defaultRules.additionalRuleLabels | indent 8 }}
{{- end }}
{{- end }}
{{- if not (.Values.defaultRules.disabled.etcdHighNumberOfLeaderChanges | default false) }}
    - alert: etcdHighNumberOfLeaderChanges
      annotations:
        description: 'etcd cluster "{{`{{`}} $labels.job {{`}}`}}": {{`{{`}} $value {{`}}`}} leader changes within the last 15 minutes. Frequent elections may be a sign of insufficient resources, high network latency, or disruptions by other components and should be investigated.'
        summary: etcd cluster has high number of leader changes.
      expr: increase((max without (instance) (etcd_server_leader_changes_seen_total{job=~".*etcd.*"}) or 0*absent(etcd_server_leader_changes_seen_total{job=~".*etcd.*"}))[15m:1m]) >= 4
      for: 5m
      labels:
        severity: warning
{{- if .Values.defaultRules.additionalRuleLabels }}
{{ toYaml .Values.defaultRules.additionalRuleLabels | indent 8 }}
{{- end }}
{{- end }}
{{- if not (.Values.defaultRules.disabled.etcdHighFsyncDurations | default false) }}
    - alert: etcdHighFsyncDurations
      annotations:
        message: 'etcd cluster "{{`{{`}} $labels.job {{`}}`}}": 99th percentile fync durations are {{`{{`}} $value {{`}}`}}s on etcd instance {{`{{`}} $labels.instance {{`}}`}}.'
      expr: |-
        histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket{job=~".*etcd.*"}[5m]))
        > 0.5
      for: 10m
      labels:
        severity: warning
{{- if .Values.defaultRules.additionalRuleLabels }}
{{ toYaml .Values.defaultRules.additionalRuleLabels | indent 8 }}
{{- end }}
{{- end }}
    - alert: etcdReadinessStatusAbnormal
      annotations:
        message: 'etcd instance {{`{{`}} $labels.pod {{`}}`}} readiness status abnormal'
      expr: |-
        kube_pod_container_status_ready{container="etcd",namespace="kube-system"} != 1
      for: 4m
      labels:
        severity: warning
    - alert: etcdRunningStatusAbnormal
      annotations:
        message: 'etcd instance {{`{{`}} $labels.pod {{`}}`}} running status abnormal'
      expr: |-
        kube_pod_container_status_running{container="etcd",namespace="kube-system"} != 1
      for: 5m
      labels:
        severity: warning
    - alert: etcdFDISAboutToRunOut
      annotations:
        message: 'etcd instance {{`{{`}} $labels.pod {{`}}`}} fd is about to run out,only {{`{{`}} $value {{`}}`}} left'
      expr: |-
        process_max_fds{job="etcd"} - process_open_fds{job="etcd"} < 10000
      for: 10m
      labels:
        severity: warning
    - alert: etcdHighPhysicalDiskUsage
      annotations:
        message: 'etcd instance {{`{{`}} $labels.pod {{`}}`}} physical disk usage is too high, the percentage is {{`{{`}} $value {{`}}`}}'
      expr: |-
        etcd_mvcc_db_total_size_in_bytes / etcd_server_quota_backend_bytes * 100  > 70
      for: 10m
      labels:
        severity: warning
    - alert: etcdHighLogicalDiskUsage
      annotations:
        message: 'etcd instance {{`{{`}} $labels.pod {{`}}`}} logical disk usage is too high, the percentage is {{`{{`}} $value {{`}}`}}'
      expr: |-
        etcd_mvcc_db_total_size_in_use_in_bytes / etcd_server_quota_backend_bytes * 100 > 70
      for: 10m
      labels:
        severity: warning
{{- end }}