replicas:
  prometheus: 2
storage:
  storageClass: middleware-lvm
  size:
    prometheus: 50Gi
retention: 168h    
image:
  prometheus:
    repository: middleware/prometheus
    tag: v2.11.0
  configmapReload:
    repository: middleware/configmap-reload
    tag: v0.0.1
  prometheusConfigReloader:
    repository: middleware/prometheus-config-reloader
    tag: v0.33.0
  nodeExporter:
    repository: middleware/node-exporter
    tag: v0.18.1
  kubeRbacProxy:
    repository: middleware/kube-rbac-proxy
    tag: v0.4.1
  prometheusAdapter:
    repository: middleware/k8s-prometheus-adapter-amd64
    tag: v0.5.0
  prometheusOperator:
    repository: middleware/prometheus-operator
    tag: v0.33.0
  kubeStateMetrics:
    repository: middleware/kube-state-metrics
    tag: v1.7.2

nodeSelector:

tolerations:
- operator: Exists

podAntiAffinityTopologKey: "zone"

#取值[hard|soft] hard:强制反亲和 soft:非强制反亲和
podAntiAffinity: "soft"





