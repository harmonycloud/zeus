apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: middleware-admission-webhook-cfg
  labels:
    app: middleware-admission-webhook
webhooks:
  - name: middleware-admission-webhook.hc.com
    admissionReviewVersions: ["v1"]
    failurePolicy: Ignore
    sideEffects: None
    clientConfig:
      service:
        name: middleware-admission-webhook-svc
        namespace: kube-system
        path: "/mutate"
      caBundle: 
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["persistentvolumeclaims"]
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
      - operations: [ "CREATE" ]
        apiGroups: [ "apps" ]
        apiVersions: [ "v1" ]
        resources: [ "statefulsets" ]
