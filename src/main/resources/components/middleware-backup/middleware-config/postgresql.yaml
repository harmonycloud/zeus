group: acid.zalan.do
version: v1
kind: postgresql
# 备份工具设置特定的环境变量
backupTool: wal-g
isCommbakcup: false
operatorImage:
  "": {{ .Values.global.repository }}/{{ .Values.global.middlewarebackup_controller.job_pgsql_backup.image }}:{{ .Values.global.middlewarebackup_controller.job_pgsql_backup.tag }}
restorePartitionMode:  one-one

######中间件中挂载信息############
# 默认数据路径
defaultDataPath: /home/postgres/pgdata/pgroot/data
# 默认挂载路径
defaultMountPath: /home/postgres/pgdata
# pvc格式
pvcFormat: pgdata-{POD_NAME}
# 恢复的时候不挂载数据卷
isRestoreMount: false

envs:
  # 该环境变量需要置空，由WALE_S3_PREFIX代替
  WALG_S3_PREFIX: ""
  TZ: "Asia/Shanghai"

# 系统变量
sysDynamicVariable:
  # 也作为分片
  partition:
    objectType: middleware
    value: "0"
  replicas:
    objectType: middleware
    jsonPath: '.spec.replicas'

backupDynamicVariable:
  # 为full表示是全量，inc为增量
  SCHEDULE_NAME:
    objectType: middlewarebackup
    jsonPath: .metadata.labels.owner
    type: env
  mode:
    objectType: middlewarebackup
    jsonPath: ".spec.customBackups[].env[]|select(.name==\"OPERATION_TYPE\")|if .value == \"backup-inc\" then \"inc\" else \"full\" end"
    type: arg
    default: "full"
  OPERATION_TYPE:
    objectType: middlewarebackup
    default: "backup"
    type: env
  podName:
    default: "{POD_NAME}"
    scope: pod
    type: arg
  pvcName:
    jsonPath: '.spec.customBackups[].commonPathBackupObjects[]|select(.pod=="{POD_NAME}")|.pvcObjects[0].pvc'
    type: arg
    scope: pod
  PGSQL_NAME:
    jsonPath: .metadata.name
    objectType: middleware
    type: env
  JOB_NAME:
    jsonPath: .metadata.name
    objectType: middlewarebackup
    type: env

restoreDynamicVariable:
  OPERATION_TYPE:
    default: "restore"
    type: env
  backupResultName:
    value: ""
    type: arg
  backupNamespace:
    value: ""
    type: arg
  podName:
    default: "{POD_NAME}"
    scope: pod
    type: arg
  pvcName:
    jsonPath: '.spec.customRestores[].commonPathRestoreObjects[]|select(.restorePodName=="{POD_NAME}")|.pvcObjects[0].pvc'
    scope: pod
    type: arg
  origCluster:
    jsonPath: .spec.name
    objectType: middlewarebackup
    type: arg
  backupId:
    jsonPath: .status.storageProvider.postgresql.backupName
    objectType: middlewarebackup
    type: arg
  PGSQL_NAME:
    jsonPath: .metadata.name
    objectType: middleware
    type: env
  JOB_NAME:
    jsonPath: .metadata.name
    type: env
  WALE_S3_PREFIX:
    jsonPath: .status.storageProvider.postgresql.repository
    objectType: middlewarebackup
    type: env
  backupTime:
    type: arg
    jsonPath: '.spec.customRestores[].env[]|select(.name=="RESTORE_TIME")|.value'

# pod选择器
defaultSelector: "[.status.conditions[]|select(.type==\"Master\" or .type==\"master\")|.name]"
# 中间件过滤器
defaultFilterMiddleware: ".status|select(.phase==\"Running\" or .phase==\"running\")"
# pod过滤器
defaultFilterPod: ""
# node过滤器
defaultFilterNode: ""

