group: es.middleware.hc.cn
version: v1alpha1
kind: ESCluster
# 备份工具设置特定的环境变量
backupTool: restic
isCommbakcup: true
operatorImage:
  "": {{ .Values.global.repository }}/{{ .Values.global.middlewarebackup_controller.common_path_backup.image }}:{{ .Values.global.middlewarebackup_controller.common_path_backup.tag }}


######中间件中挂载信息############
# 默认数据路径
defaultDataPath: /data/elastic/{NAME}/{POD_NAME}/data/nodes/0/indices
# 默认挂载路径
defaultMountPath: /data/elastic/{NAME}
# pvc格式
pvcFormat: es-data-{POD_NAME}


# 静态环境变量
envs:
  TZ: "Asia/Shanghai"


sysDynamicVariable:
  partition:
    default: "{POD_NAME}"
    objectType: middleware
    regexp: ".+?-(cold-\\d+|master-\\d+|data-\\d+)"
    scope: pod
  elasticPassword:
    jsonPath: ".spec.elasticPass"
    objectType: middleware
  masterService:
    default: "{NAME}"
    objectType: middleware
    format: "%s-master"
  elasticHttpPort:
    jsonPath: ".spec.esHttpPort"
    objectType: middleware
  customVolumes:
    jsonPath: '(.status.conditions[]|select(.name=="{POD_NAME}")|.type) as $type | if $type == "master" then .spec.customVolumes|map(select(.name=="masterNode-data")) else if $type == "data" then .spec.customVolumes|map(select(.name=="dataNode-data")) else .spec.customVolumes|map(select(.name=="coldNode-data"))  end end|map(. + {"dataPath": "\(.mountPath)/nodes/0/indices"})'
    objectType: "middleware"

backupDynamicVariable:
  clusterName:
    jsonPath: .metadata.name
    objectType: middleware
    type: arg
  podName:
    default: "{POD_NAME}"
    scope: pod
    type: arg
  pvcName:
    jsonPath: '.spec.customBackups[].commonPathBackupObjects[]|select(.pod=="{POD_NAME}")|.pvcObjects[0].pvc'
    type: arg
    scope: pod
  paths:
    jsonPath: ".spec.customBackups[].commonPathBackupObjects[]|select(.pod==\"{POD_NAME}\")|.pvcObjects[].paths"
    scope: pod
    type: arg
  excludeFiles:
    jsonPath: ".spec.customBackups[].commonPathBackupObjects[]|select(.pod==\"{POD_NAME}\")|.pvcObjects[].excludeFiles"
    scope: pod
    type: arg
  clusterType:
    jsonPath: .spec.type
    type: arg

# 恢复变量
restoreDynamicVariable:
  OPERATION_TYPE:
    value: restore
    type: env
  paths:
    jsonPath: '.spec.customRestores[].commonPathRestoreObjects[]|select(.restorePodName=="{POD_NAME}")|.pvcObjects[0].paths'
    scope: pod
    type: arg
  restorePodName:
    default: "{POD_NAME}"
    type: arg
    scope: pod
  backupPodName:
    jsonPath: '.spec.customRestores[].commonPathRestoreObjects[]|select(.restorePodName=="{POD_NAME}")|.backupPodName'
    type: arg
    scope: pod
  podName:
    default: "{POD_NAME}"
    type: arg
    scope: pod
  pvcName:
    jsonPath: '.spec.customRestores[].commonPathRestoreObjects[]|select(.restorePodName=="{POD_NAME}")|.pvcObjects[0].pvc'
    type: arg
    scope: pod
  clusterType:
    jsonPath: .spec.type
    type: arg
    scope: pod
  namespace:
    jsonPath: .metadata.namespace
    type: arg
  backupNamespace:
    jsonPath: .metadata.namespace
    type: arg
  restoreNamespace:
    jsonPath: .metadata.namespace
    type: arg
  clusterName:
    jsonPath: .spec.name
    type: arg

# pod选择器
defaultSelector: 'if .spec.clusterMode=="simple" then [.status.conditions[]|select(.type=="master" or .type=="cold")|.name] else [.status.conditions[]|select(.type=="data" or .type=="cold")|.name] end'

defaultRestoreSelector: 'if .spec.clusterMode=="simple" then [.status.conditions[]|select(.type=="master" or .type=="cold")|.name] else [.status.conditions[]|select(.type=="data" or .type=="cold")|.name] end'

# 中间件过滤器
defaultFilterMiddleware: ".status|select(.phase==\"Running\" or .phase==\"running\")"
# pod过滤器
defaultFilterPod: ""
# node过滤器
defaultFilterNode: ""
#defaultFilterNode: "select(.metadata.labels.\"topology.kubernetes.io/zone\"==\"zoneA\")"

